name: Build Timestamp Genius

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Fetch bundled offline speech models
        run: |
          set -euo pipefail
          rm -rf app/src/main/assets/models
          mkdir -p app/src/main/assets/models/en app/src/main/assets/models/hi
          curl -fL --retry 3 --retry-delay 2 -o /tmp/en.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          curl -fL --retry 3 --retry-delay 2 -o /tmp/hi.zip https://alphacephei.com/vosk/models/vosk-model-small-hi-0.22.zip
          unzip -q /tmp/en.zip -d /tmp
          unzip -q /tmp/hi.zip -d /tmp
          cp -a /tmp/vosk-model-small-en-us-0.15/. app/src/main/assets/models/en/
          cp -a /tmp/vosk-model-small-hi-0.22/. app/src/main/assets/models/hi/
          test -f app/src/main/assets/models/en/conf/model.conf
          test -f app/src/main/assets/models/hi/conf/model.conf
      - name: Source quality gate
        run: |
          set -euo pipefail
          grep -q 'UPLOAD PDF' app/src/main/java/com/futurethinking/audiotimestampcapture/MainActivity.kt
          grep -q 'LAST PDF RECORDED' app/src/main/java/com/futurethinking/audiotimestampcapture/MainActivity.kt
          grep -q 'NEW SESSION' app/src/main/java/com/futurethinking/audiotimestampcapture/MainActivity.kt
          grep -q 'AudioPlaybackCaptureConfiguration' app/src/main/java/com/futurethinking/audiotimestampcapture/LiveSpeechTimer.kt
          grep -q 'Recognizer(model,16000f)' app/src/main/java/com/futurethinking/audiotimestampcapture/LiveSpeechTimer.kt
          grep -q 'ScriptTimestamper' app/src/main/java/com/futurethinking/audiotimestampcapture/TimestampPdfWriter.kt
      - name: Diagnostic compile
        shell: bash
        run: |
          set +e
          gradle testDebugUnitTest assembleDebug --stacktrace > build.log 2>&1
          status=$?
          echo "GRADLE_EXIT=$status"
          tail -n 250 build.log
          exit $status
      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timestamp-genius-build-log
          path: build.log
          if-no-files-found: warn
      - name: Verify APK
        if: success()
        run: |
          unzip -t app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging app/build/outputs/apk/debug/app-debug.apk
      - name: Publish debug APK
        if: success()
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk timestamp-genius.apk
          sha256sum timestamp-genius.apk | tee timestamp-genius.apk.sha256
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: timestamp-genius-diagnostic
          path: |
            timestamp-genius.apk
            timestamp-genius.apk.sha256
