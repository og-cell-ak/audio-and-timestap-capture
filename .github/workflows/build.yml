name: Timestamp Genius APK
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Bundle offline Vosk models
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/models
          curl -fL --retry 4 --connect-timeout 20 https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip -o /tmp/en.zip
          curl -fL --retry 4 --connect-timeout 20 https://alphacephei.com/vosk/models/vosk-model-small-hi-0.22.zip -o /tmp/hi.zip
          unzip -q /tmp/en.zip -d app/src/main/assets/models
          unzip -q /tmp/hi.zip -d app/src/main/assets/models
          test -f app/src/main/assets/models/vosk-model-small-en-us-0.15/am/final.mdl
          test -f app/src/main/assets/models/vosk-model-small-hi-0.22/am/final.mdl
      - name: Compile and unit verify
        run: gradle testDebugUnitTest assembleDebug
      - name: Verify APK archive
        run: unzip -t app/build/outputs/apk/debug/app-debug.apk
      - name: Verify APK package
        run: $ANDROID_HOME/build-tools/35.0.0/aapt dump badging app/build/outputs/apk/debug/app-debug.apk | grep -E 'package: name=|launchable-activity'
