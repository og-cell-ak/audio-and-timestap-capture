name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Apply verified v4 sources
        run: |
          cp upgrade_payload/CaptureService.kt app/src/main/java/com/futurethinking/audiotimestampcapture/CaptureService.kt
          cp upgrade_payload/TimestampEngine.kt app/src/main/java/com/futurethinking/audiotimestampcapture/TimestampEngine.kt
          cp upgrade_payload/TimestampPdfWriter.kt app/src/main/java/com/futurethinking/audiotimestampcapture/TimestampPdfWriter.kt

      - name: Verify unit tests and build APK
        run: gradle testDebugUnitTest assembleDebug
      - name: Verify APK archive
        run: unzip -t app/build/outputs/apk/debug/app-debug.apk
      - name: Verify APK package
        run: |
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging app/build/outputs/apk/debug/app-debug.apk | grep -E 'package: name=|launchable-activity'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: audio-timestamp-capture-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish direct APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="audio-timestamp-studio-v3.0.0-${GITHUB_SHA:0:12}"
          gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Audio Timestamp Studio v3.0.0" \
            --notes "Editable line-box screen reading, floating capture controls, audio-to-line matching, and timestamp-only PDF output." \
            --prerelease
