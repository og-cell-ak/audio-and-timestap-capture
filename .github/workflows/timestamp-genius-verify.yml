name: Timestamp Genius Independent Verify
on:
  push:
    branches: [ timestamp-genius-ci-verify ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Download offline speech models
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/models
          curl -fL --retry 5 --connect-timeout 30 https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip -o /tmp/en.zip
          curl -fL --retry 5 --connect-timeout 30 https://alphacephei.com/vosk/models/vosk-model-small-hi-0.22.zip -o /tmp/hi.zip
          unzip -q /tmp/en.zip -d app/src/main/assets/models
          unzip -q /tmp/hi.zip -d app/src/main/assets/models
          test -f app/src/main/assets/models/vosk-model-small-en-us-0.15/am/final.mdl
          test -f app/src/main/assets/models/vosk-model-small-hi-0.22/am/final.mdl
      - name: Build pass 1
        run: gradle testDebugUnitTest assembleDebug
      - name: Build pass 2
        run: gradle testDebugUnitTest assembleDebug
      - name: Build pass 3
        run: gradle testDebugUnitTest assembleDebug
      - name: Build pass 4
        run: gradle testDebugUnitTest assembleDebug
      - name: Build pass 5
        run: gradle testDebugUnitTest assembleDebug
      - name: APK archive verification
        run: unzip -t app/build/outputs/apk/debug/app-debug.apk
      - name: APK identity verification
        run: |
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging app/build/outputs/apk/debug/app-debug.apk
